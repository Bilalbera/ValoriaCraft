<style>
    /* Global & Renk Ayarları (Aydınlık Tema) */
    :root {
        --main-bg-color: #f0f0f0; /* Açık/Beyaz arka plan */
        --secondary-bg-color: #ffffff; /* Kart arka planı (Daha beyaz) */
        --accent-color: #007bff; /* Mavi vurgu rengi */
        --accent-hover: #0056b3; /* Mavi hover rengi */
        --text-color: #333333; /* Koyu metin rengi */
        --light-text-color: #666; /* Açık gri metin */
        --border-color: #e0e0e0;
        --shadow-color: rgba(0, 0, 0, 0.1);
    }

    body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--main-bg-color);
        color: var(--text-color);
        line-height: 1.6;
    }

    h1, h2, h3, h4 {
        font-family: 'Orbitron', sans-serif;
        color: var(--accent-color);
        margin-bottom: 15px;
    }

    a {
        color: var(--accent-color);
        text-decoration: none;
        transition: color 0.3s ease;
    }

    a:hover {
        color: var(--accent-hover);
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
        padding: 20px 0;
    }

    /* Header / Navbar */
    header {
        background-color: var(--secondary-bg-color);
        padding: 15px 0;
        border-bottom: 2px solid var(--border-color);
        box-shadow: 0 4px 10px var(--shadow-color);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
    }

    .logo {
        font-family: 'Orbitron', sans-serif;
        font-size: 2.2em;
        font-weight: 700;
        color: var(--accent-color);
        text-shadow: none;
    }

    .logo span {
        color: var(--text-color);
    }

    .nav-links {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
    }

    .nav-links li {
        margin-left: 30px;
    }
    
    .nav-links a {
        font-family: 'Orbitron', sans-serif;
        font-size: 1em;
        color: var(--text-color);
        position: relative;
    }

    .nav-links a:hover {
        color: var(--accent-color);
    }
    
    /* Hero/Banner Bölümü */
    .hero {
        height: 500px;
        /* Arka plan görseli artık açık renkte görünecek */
        background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('https://i.imgur.com/your-server-background-image.jpg') no-repeat center center/cover; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-bottom: 3px solid var(--accent-color);
    }

    .hero h1 {
        font-size: 4em;
        margin-bottom: 5px;
        color: var(--accent-hover); /* Daha koyu mavi */
        text-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }

    .hero p {
        font-size: 1.3em;
        margin-bottom: 30px;
        color: var(--text-color);
    }

    .ip-box {
        background-color: var(--secondary-bg-color);
        padding: 15px 30px;
        border-radius: 8px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.5em;
        font-weight: bold;
        display: inline-block;
        border: 2px solid var(--accent-color);
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        cursor: pointer;
        color: var(--text-color);
        transition: background-color 0.3s ease, transform 0.3s ease, color 0.3s ease;
    }

    .ip-box:hover {
        background-color: var(--accent-color);
        color: #ffffff; /* Hover'da beyaz metin */
        transform: scale(1.05);
    }

    /* Oyun Modları Bölümü */
    #gamemodes {
        padding: 80px 0;
        background-color: var(--main-bg-color);
    }

    .section-title {
        text-align: center;
        font-size: 3em;
        margin-bottom: 60px;
        position: relative;
    }
    
    .section-title::after {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 3px;
        background-color: var(--accent-color);
        border-radius: 2px;
    }

    .mode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
    }

    .mode-card {
        background-color: var(--secondary-bg-color);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 16px var(--shadow-color);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .mode-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .mode-image {
        width: 100%;
        height: 200px;
        background-color: #ccc; /* Resim yoksa yer tutucu renk */
        background-size: cover;
        background-position: center;
        /* Alt kısım için mavi vurgu */
        border-bottom: 3px solid var(--accent-color);
    }
    
    /* Arka Plan Resimleri (Yer tutucu olarak - Görünürlük için opaklık düşürülmeliydi, şimdi açık renkli tasarıma göre ayarlandı) */
    .mode-image.boxpvp { 
        background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('https://i.imgur.com/boxpvp-image-placeholder.jpg'); 
    }
    .mode-image.survival { 
        background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('https://i.imgur.com/survival-image-placeholder.jpg'); 
    }
    .mode-image.skyblock { 
        background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('https://i.imgur.com/skyblock-image-placeholder.jpg'); 
    }

    .mode-content {
        padding: 25px;
        text-align: center;
    }

    .mode-content h3 {
        font-size: 2em;
        margin-top: 0;
        color: var(--accent-color);
    }

    .mode-content p {
        font-size: 0.95em;
        margin-bottom: 20px;
        color: var(--light-text-color);
    }
    
    .button {
        display: inline-block;
        background-color: var(--accent-color);
        color: #ffffff; /* Beyaz metin */
        padding: 12px 25px;
        border-radius: 6px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .button:hover {
        background-color: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Footer */
    footer {
        background-color: var(--secondary-bg-color);
        color: var(--light-text-color);
        text-align: center;
        padding: 30px 0;
        border-top: 2px solid var(--border-color);
        font-size: 0.9em;
    }
    
    .social-links a {
        font-size: 1.5em;
        margin: 0 10px;
        color: var(--light-text-color);
    }

    .social-links a:hover {
        color: var(--accent-color);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
        }
        .nav-links {
            margin-top: 15px;
            justify-content: center;
        }
        .nav-links li {
            margin: 0 10px;
        }
        .hero h1 {
            font-size: 3em;
        }
        .ip-box {
            font-size: 1.2em;
        }
        .section-title {
            font-size: 2.5em;
        }
    }
</style>
